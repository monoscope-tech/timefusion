name: Build and Deploy

on:
  push:
    branches: [ master ]
    # A docs-only push must not restart prod. Every deploy replaces the running
    # container, and the footer-repair cron is hourly with a 2.4h budget
    # (`spawn_cron_job` drops overlapping ticks), so a restart costs the
    # in-flight bin AND pushes the next attempt to the following :30. On
    # 2026-08-12 three pushes — two of them markdown only — meant the whale
    # backlog (1038 files, see docs/plans/2026-08-12-whale-backlog-burndown.md)
    # burned down by exactly zero files. `paths-ignore` skips only when EVERY
    # changed path matches, so a commit touching code still deploys.
    # `bench/` is python/shell load-gen and audit tooling — not cargo, not in
    # the binary. A push there cannot change the running image, so deploying
    # for it only costs a restart. 2026-08-24: five pushes to ONE benchmark
    # script restarted prod five times in an hour, while that very script was
    # measuring how cost varies with process uptime — the measurement was
    # destroying its own precondition.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'bench/**'

# Serialize deploys. Keep the active build alive: GitHub concurrency already
# retains at most one pending run and replaces older pending runs with the
# latest push. Cancelling the active 25-minute image build on every empty
# rollout trigger caused permanent starvation during busy master periods.
# Serialization still prevents build-completion order from letting an older
# image overwrite a newer deployment (2026-06-11: 037e1b9 overwrote e11ed65).
concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use a container-based driver (using BuildKit) to enable cache export.
          driver-opts: image=moby/buildkit:master

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Preset Image Name
        run: |
          REPO=$(echo ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_URL=${REPO}:$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
          # Mutable :latest so downstream consumers (e.g. monoscope CI's TF service
          # container) can track the newest master build without pinning a SHA.
          # This workflow only runs on master push, so :latest == latest master.
          echo "IMAGE_LATEST=${REPO}:latest" >> $GITHUB_ENV

      - name: Find locally signed-off image
        id: candidate
        run: |
          if image="$(python3 scripts/production-image.py resolve)"; then
            echo "image=$image" >> "$GITHUB_OUTPUT"
          else
            echo "No matching published candidate; building the production image here"
          fi

      - name: Build and Push Docker Image
        if: steps.candidate.outputs.image == ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URL }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote locally built image
        if: steps.candidate.outputs.image != ''
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          docker buildx imagetools create --tag "$IMAGE_URL" --tag "$IMAGE_LATEST" "$CANDIDATE_IMAGE"

      # Pin the digest before smoke and deployment. Moving a tag afterward must
      # never make CapRover deploy bytes different from the tested image.
      - name: Smoke test production image
        run: |
          image="$(python3 scripts/production-image.py digest "$IMAGE_URL")"
          docker pull "$image"
          python3 scripts/production-image.py smoke "$image"
          echo "IMAGE_URL=$image" >> "$GITHUB_ENV"

      # Install the same CLI used by caprover/deploy-from-github@v1.1.2 before
      # starting the handoff clock. Pin it: the upstream action installs an
      # unpinned latest package inside its container, which makes deploy
      # behavior change underneath us.
      - name: Install CapRover deploy client
        run: npm install --global caprover@2.3.1

      - name: Deploy and verify production
        env:
          CAPROVER_SERVER: ${{ secrets.CAPTAINROVER_SERVER }}
          CAPROVER_APP: ${{ secrets.CAPTAINROVER_APP_NAME }}
          CAPROVER_TOKEN: ${{ secrets.CAPTAINROVER_APP_TOKEN }}
          PGURL: ${{ secrets.TIMEFUSION_PG_URL }}
        run: python3 scripts/deploy/run.py ci
