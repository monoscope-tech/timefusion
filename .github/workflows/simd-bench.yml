# A/B the microarchitecture flag on x86, because nothing else can.
#
# `-C target-cpu` was never set until 2026-08-13, so prod ran a BASELINE x86-64
# binary (SSE2, no AVX2/BMI2/FMA) while arrow-rs relies on autovectorization for
# its compare/filter/aggregate kernels and the parquet decoders. Disassembly
# proves the flag landed — `%ymm` occurrences went 29,943 -> 1,321,656 — but an
# instruction count is not a speedup, and the dev machines are arm64, so the only
# honest way to size the win is to run the same benchmark twice on x86 with
# nothing but the flag changed.
#
# Manual on purpose: each leg rebuilds every dependency (RUSTFLAGS is part of the
# cache key), so this is ~2 full release builds, not something to hang off pushes.
name: SIMD A/B bench

on:
  workflow_dispatch:
    inputs:
      baseline_cpu:
        description: "target-cpu for leg A (what prod shipped before)"
        default: "x86-64"
      candidate_cpu:
        description: "target-cpu for leg B (x86-64-v3 today; x86-64-v4 to canary AVX-512)"
        default: "x86-64-v3"
      filter:
        description: "criterion filter, e.g. flush_dedup"
        default: "flush_dedup"
      bench:
        description: "bench target"
        default: "dedup_benchmarks"

permissions:
  contents: read

jobs:
  ab:
    name: "${{ inputs.baseline_cpu }} vs ${{ inputs.candidate_cpu }}"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The bench profile inherits `release` (thin LTO, 16 CGUs), and building this
    # dep tree that way killed a 4-vCPU runner mid-link. Lighten codegen for both
    # legs: the A/B stays valid because the two legs differ ONLY in target-cpu,
    # and if anything this UNDER-states the win by muting cross-crate inlining.
    env:
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "256"
      CARGO_PROFILE_BENCH_DEBUG: "0"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2

      # The runner is not the deploy host. If it lacks the candidate's features
      # the numbers are meaningless (or the binary faults), so say what it has.
      - name: Runner CPU
        run: lscpu | grep -iE "^Model name|^Flags" | tr ' ' '\n' | grep -iE "^(model|avx|avx2|avx512f|bmi1|bmi2|fma)$|Model" || lscpu | head -20

      # Build BOTH binaries first, then INTERLEAVE them on the same machine.
      #
      # Running leg A to completion and then leg B does not measure the flag: on
      # 2026-08-13 the second leg came out 27-45% slower in BOTH orderings, i.e.
      # the effect tracked run ORDER, not target-cpu, and between-run variance on
      # a shared 4-vCPU runner reached 2.5x on the same configuration. Alternating
      # A/B/A/B/A/B inside one job cancels a monotone drift (thermal, noisy
      # neighbour, cache state) instead of charging it to whichever leg ran last.
      - name: Build leg A — ${{ inputs.baseline_cpu }}
        env:
          RUSTFLAGS: -C target-cpu=${{ inputs.baseline_cpu }}
        run: |
          cargo bench --bench ${{ inputs.bench }} --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | tail -1 > /tmp/pathA
          cp "$(cat /tmp/pathA)" /tmp/benchA && /tmp/benchA --version 2>/dev/null || true

      - name: Build leg B — ${{ inputs.candidate_cpu }}
        env:
          RUSTFLAGS: -C target-cpu=${{ inputs.candidate_cpu }}
        run: |
          cargo bench --bench ${{ inputs.bench }} --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | tail -1 > /tmp/pathB
          cp "$(cat /tmp/pathB)" /tmp/benchB

      - name: Interleaved A/B/A/B/A/B
        run: |
          set -o pipefail
          for round in 1 2 3; do
            echo "::group::round $round — A (${{ inputs.baseline_cpu }})"
            /tmp/benchA --bench ${{ inputs.filter }} --save-baseline "A$round" 2>&1 | grep -E "^flush|time:" || true
            echo "::endgroup::"
            echo "::group::round $round — B (${{ inputs.candidate_cpu }})"
            /tmp/benchB --bench ${{ inputs.filter }} --save-baseline "B$round" 2>&1 | grep -E "^flush|time:" || true
            echo "::endgroup::"
          done
          echo "=== MEDIAN ESTIMATE PER BENCH (criterion point estimates, ns) ==="
          for bench_dir in target/criterion/*/; do
            name=$(basename "$bench_dir")
            [ -d "$bench_dir" ] || continue
            for leg in A B; do
              vals=$(for r in 1 2 3; do
                f="$bench_dir/$leg$r/estimates.json"
                [ -f "$f" ] && jq -r '.mean.point_estimate' "$f"
              done | sort -n | tr '\n' ' ')
              [ -n "$vals" ] && echo "$name  leg$leg  samples(sorted ns): $vals"
            done
          done

      - name: Criterion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ inputs.baseline_cpu }}-vs-${{ inputs.candidate_cpu }}
          path: target/criterion
          retention-days: 7
