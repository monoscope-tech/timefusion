name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write # to publish attestation refs under refs/ci-attest/*

# A newer push makes an in-flight run for the same branch obsolete. Keep pull
# requests isolated from one another while avoiding wasted Blacksmith minutes
# during rapid pushes to a branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation bloats the cache without helping CI (no warm
  # incremental state across runs). Disabling it makes target/ smaller.
  CARGO_INCREMENTAL: "0"
  # Kill switch for the attestation cache: set the repo variable to "true" and
  # every job runs every check again, no code change needed.
  CI_ATTEST_DISABLED: ${{ vars.CI_ATTEST_DISABLED }}

jobs:
  # What CI does NOT have to do. Every check in ci/checks.tsv is fingerprinted
  # over the content it depends on; if the identical content was already proven —
  # by an earlier run, another branch, or a developer's `make ci` — the result is
  # on the remote as a ref and the job below skips it. See docs/local-ci.md.
  gate:
    name: Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      fingerprints: ${{ steps.checks.outputs.fingerprints }}
      skip_fmt: ${{ steps.checks.outputs.skip_fmt }}
      skip_clippy: ${{ steps.checks.outputs.skip_clippy }}
      skip_test: ${{ steps.checks.outputs.skip_test }}
      skip_pg_smoke: ${{ steps.checks.outputs.skip_pg_smoke }}
      skip_e2e: ${{ steps.checks.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: checks
        run: scripts/ci/ci.sh gate

  fmt:
    name: Format
    needs: gate
    if: needs.gate.outputs.skip_fmt != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      # rustfmt.toml is stable-only, and rust-toolchain.toml pins the stable
      # channel, so plain `cargo fmt` here uses the exact same rustfmt as every
      # contributor's local checkout — deterministic, no local-vs-CI drift.
      - name: Format
        env:
          FINGERPRINTS: ${{ needs.gate.outputs.fingerprints }}
        run: |
          mkdir -p .ci && printf '%s\n' "$FINGERPRINTS" > .ci/fingerprints.tsv
          export CI_FINGERPRINTS=.ci/fingerprints.tsv
          scripts/ci/ci.sh run fmt
      # NOTE: a former step here grepped vendor/datafusion-postgres for the
      # `was_pre_optimized` optimize-skip patch. That crate is now a git dep
      # ([patch.crates-io] in Cargo.toml → apitoolkit/datafusion-postgres@timefusion-df54),
      # so the grep targeted a deleted path and failed every run. The
      # optimize-skip behavioral contract is consequently NOT CI-guarded: if a
      # branch bump drops the patch, extended queries silently double-optimize.
      # Verify the patch on every datafusion-postgres rev bump (see plan_cache.rs);
      # a round-trip "no double state.optimize()" smoke test would re-add a guard.

  # Run Clippy independently so it overlaps the test shards instead of adding
  # ~2.5 minutes to their critical path. It deliberately uses the same cache
  # family as tests so artifacts remain reusable across workflow runs.
  clippy:
    name: Clippy
    needs: gate
    if: needs.gate.outputs.skip_clippy != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: build-test
      # `cargo lint` is the alias in `.cargo/config.toml`; `make lint`, the
      # autofix workflow, and this gate therefore cannot drift.
      - name: Clippy
        env:
          FINGERPRINTS: ${{ needs.gate.outputs.fingerprints }}
        run: |
          mkdir -p .ci && printf '%s\n' "$FINGERPRINTS" > .ci/fingerprints.tsv
          export CI_FINGERPRINTS=.ci/fingerprints.tsv
          scripts/ci/ci.sh run clippy

  # Keep the existing check name to avoid invalidating branch-protection rules;
  # Clippy itself now runs in parallel in the dedicated job above.
  build-test:
    name: Clippy & Test (shard ${{ matrix.shard }})
    needs: gate
    if: needs.gate.outputs.skip_test != 'true' || needs.gate.outputs.skip_pg_smoke != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Tests run concurrently now. The old `--test-threads=1` was there because
    # every `WalManager` shared the process-global `WALRUS_DATA_DIR`, so two
    # concurrent tests corrupted each other's WAL (9/9 tantivy_e2e failed).
    # `Walrus::with_root` takes the directory as a parameter, so each test's
    # config already isolates it and the serialization is no longer needed.
    # The full parallel suite is ~1.5 min locally. Keep two shards because CI
    # feedback latency is the primary goal; more shards would add build/setup
    # duplication for diminishing wall-clock improvement.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # A Cargo.lock change busts the rust-cache key and forces a full cold
    # recompile, which alone can approach the old 25m cap and starve the
    # (S3-integration-heavy) test run — the 2026-07-10/11 timeouts. 45m gives
    # cold builds headroom.
    timeout-minutes: 45
    env:
      AWS_SDK_LOAD_CONFIG: "false"
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: timefusion-test
      AWS_S3_ENDPOINT: http://127.0.0.1:9000
      # Reuse the MinIO started below; the sqllogictest harness skips its
      # own testcontainers MinIO when this is set (avoids nested Docker).
      TIMEFUSION_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_ALLOW_HTTP: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      PGWIRE_PORT: "12345"
      PORT: "8080"
      TIMEFUSION_TABLE_PREFIX: timefusion-ci-test
      BATCH_INTERVAL_MS: "1000"
      MAX_BATCH_SIZE: "1000"
      ENABLE_BATCH_QUEUE: "true"
      MAX_PG_CONNECTIONS: "100"
      AWS_S3_LOCKING_PROVIDER: ""
      # Use small cache sizes for CI tests (similar to test_config in object_store_cache.rs)
      TIMEFUSION_FOYER_MEMORY_MB: "10"
      TIMEFUSION_FOYER_DISK_MB: "50"
      TIMEFUSION_FOYER_METADATA_MEMORY_MB: "10"
      TIMEFUSION_FOYER_METADATA_DISK_MB: "50"
      TIMEFUSION_FOYER_SHARDS: "2"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # `public.ecr.aws/bitnami/minio` was withdrawn (Bitnami consolidated registries).
      # GitHub Actions `services:` can't override the entrypoint to pass `server /data`
      # to the official quay.io/minio/minio image, so start it manually and seed the
      # buckets that the bitnami image used to auto-create via MINIO_DEFAULT_BUCKETS.
      - name: Start MinIO
        run: |
          # Pinned to a known-good release so a breaking upstream tag doesn't silently break CI.
          MINIO_IMAGE=quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          MC_IMAGE=quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$MINIO_IMAGE" server /data --console-address ":9001"
          # `set -e` (GH Actions default) makes `curl && break` abort the script on the
          # first failed curl, so we wrap the polling in an `if` instead.
          for _ in {1..60}; do
            if curl -sf http://localhost:9000/minio/health/live; then
              break
            fi
            sleep 1
          done
          if ! curl -sf http://localhost:9000/minio/health/live; then
            echo "MinIO failed to become healthy after 60s"
            docker logs minio
            exit 1
          fi
          # mc image's ENTRYPOINT is `mc` itself, so we override to /bin/sh to run a
          # multi-command script. (Without --entrypoint, `mc sh -c '...'` is what runs
          # and mc rejects `sh` as an unknown subcommand.)
          docker run --rm --network host --entrypoint /bin/sh "$MC_IMAGE" -c '
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb -p local/timefusion-test local/timefusion-tests'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: build-test
      # Pin the nextest version (not the floating `@nextest` tag) so an upstream
      # release can't silently change --partition/CLI behavior, matching the
      # MinIO/mc image pinning above.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140

      # Default features only. `--all-features` would enable `e2e`, which runs
      # the testcontainers e2e suite here in parallel — 40 tests each spinning a
      # per-test MinIO container swamps the 4-vCPU box and hangs
      # (restart_recovery::cold_start_under_five_seconds timed out the job,
      # 2026-07-20). The e2e suite is owned by the `e2e` job below (single-
      # threaded); the only other features are `test` (unused) and `profiling`
      # (prod-only, already lint-covered by the Clippy step's --all-features).
      # CI_NO_ATTEST: a partitioned run proves only its slice. The test-attest
      # job below records the check once both shards are green.
      - name: Test
        if: needs.gate.outputs.skip_test != 'true'
        env:
          CI_PARTITION: hash:${{ matrix.shard }}/2
          CI_NO_ATTEST: 'true'
        run: scripts/ci/ci.sh run test

      # libpq 18 sends a protocol-3.2 probe during startup. Exercise the real
      # client and its catalog meta-commands rather than only replaying SQL.
      - name: PostgreSQL 18 client smoke
        if: matrix.shard == 1 && needs.gate.outputs.skip_pg_smoke != 'true'
        env:
          FINGERPRINTS: ${{ needs.gate.outputs.fingerprints }}
        run: |
          mkdir -p .ci && printf '%s\n' "$FINGERPRINTS" > .ci/fingerprints.tsv
          export CI_FINGERPRINTS=.ci/fingerprints.tsv
          scripts/ci/ci.sh run pg-smoke

  # `test` covers the whole suite, but CI proves it in two partitions. Record it
  # once — and only once both slices are green, so a half-passing run can never
  # let a later run skip the suite.
  test-attest:
    name: Attest test
    needs: [gate, build-test]
    if: always() && needs.build-test.result == 'success' && needs.gate.outputs.skip_test != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Attest
        env:
          FINGERPRINTS: ${{ needs.gate.outputs.fingerprints }}
        run: |
          mkdir -p .ci && printf '%s\n' "$FINGERPRINTS" > .ci/fingerprints.tsv
          CI_FINGERPRINTS=.ci/fingerprints.tsv scripts/ci/ci.sh attest test

  # E2E suite: full pgwire → BufferedWriteLayer → WAL → Delta path against a
  # per-test MinIO via testcontainers. Runs in its own job so failures are
  # attributable and the suite can be made a required check independently.
  e2e:
    name: E2E
    needs: gate
    if: needs.gate.outputs.skip_e2e != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: e2e
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # Capped at 2 concurrent: each e2e test starts its own MinIO container, and
      # more than a couple at a time swamps a 4-vCPU runner (the 2026-07-20
      # cold_start timeout). The WAL is per-test-config now, so the old
      # `--test-threads=1` is no longer a correctness requirement.
      - name: E2E
        env:
          FINGERPRINTS: ${{ needs.gate.outputs.fingerprints }}
        run: |
          mkdir -p .ci && printf '%s\n' "$FINGERPRINTS" > .ci/fingerprints.tsv
          export CI_FINGERPRINTS=.ci/fingerprints.tsv
          scripts/ci/ci.sh run e2e
