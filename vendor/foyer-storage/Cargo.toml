    "foyer-common/strict_assertions",
    "foyer-memory/strict_assertions",
]
test_utils = []
tracing = [
    "dep:fastrace",
    "foyer-common/tracing",
    "foyer-memory/tracing",
]

[lib]
name = "foyer_storage"
path = "src/lib.rs"

[[test]]
name = "storage_fuzzy_test"
