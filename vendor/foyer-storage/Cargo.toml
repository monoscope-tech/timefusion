[package]
edition = "2024"
rust-version = "1.91.0"
name = "foyer-storage"
version = "0.22.6"
authors = ["MrCroxx <mrcroxx@outlook.com>"]
build = false
exclude = ["website/*"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "storage engine for foyer - Hybrid cache for Rust"
homepage = "https://github.com/foyer-rs/foyer"
readme = "README.md"
keywords = [
    "cache",
    "hybrid",
]
license = "Apache-2.0"
repository = "https://github.com/foyer-rs/foyer"
resolver = "2"

[features]
clap = ["dep:clap"]
deadlock = ["parking_lot/deadlock_detection"]
default = ["tokio/runtime-tokio"]
nightly = [
    "allocator-api2/nightly",
    "hashbrown/nightly",
]
