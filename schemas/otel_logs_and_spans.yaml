  # The dimension monoscope's app-wide environment selector (prod/staging/…) scopes by.
  # Deliberately NOT a sorting column: the sort key list is load-bearing for the TopK
  # pushdown described at the top of this file, and environment is low cardinality, so it
  # prunes badly by sort order and well by row-group statistics, which it gets for free.
  # Additive and nullable, so existing tables evolve into it via SchemaMode::Merge.
  - name: resource___deployment___environment___name
    data_type: Utf8
    nullable: true
  - name: resource___telemetry___sdk___language
    data_type: Utf8
    nullable: true
  - name: resource___telemetry___sdk___name
    data_type: Utf8
    nullable: true
  - name: resource___telemetry___sdk___version
    data_type: Utf8
    nullable: true
  - name: resource___user_agent___original
    data_type: Utf8
    nullable: true
  - name: project_id
    data_type: Utf8
    # Partition column. Declared nullable because delta-rs's per-file
    # stats builder constructs a StructArray that nulls out partition
    # columns (the value lives in the partition path, not the column),
    # and a non-nullable declaration here makes every write fail with
    # "Found unmasked nulls for non-nullable StructArray field project_id"
    # before any data lands in Delta. The application contract (every row
    # MUST have a project_id) is enforced at the routing layer, not in
    # the schema.
    nullable: true
  - name: summary
    data_type: "List(Utf8)"
    nullable: false
    tantivy: { indexed: true, tokenizer: ngram3 }
  - name: errors
    data_type: Variant
    nullable: true
  - name: message_size_bytes
