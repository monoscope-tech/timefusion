  # load-bearing: 7d68f01 took prod down with `number of columns(94) must match
  # number of fields(92)` by adding fields the transaction log did not have.
  # TF-owned version stamp (`dedup_tiebreak`), overwritten by
  # `insert_coerce::stamp_version` on every write.
  - name: updated_at
