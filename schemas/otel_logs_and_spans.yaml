    nullable: true
  # Merge-on-read tombstone (`tombstone_column`): the winning version being
  # `true` means the row is deleted.
  - name: deleted
    data_type: Boolean
    nullable: true

# Continuous-aggregate rollups derived from this table. The rollup's own table
# (`otel_logs_and_spans_rollup_dashboard_1m_v3`) is SYNTHESIZED from this spec plus the field
# definitions below, so a measure's type cannot drift from the column it
# aggregates and adding a rollup needs no second schema file.
#
# Every dimension must be low-cardinality: rows per bucket is roughly the
# product of their distinct counts, and at 1m grain that product has to stay in
# the low thousands or the rollup is a slightly smaller copy of this table.
# A filter on any column NOT listed disqualifies a query from routing, because a
# filter cannot be applied after aggregation.
rollups:
  - grain: 1m
    name: dashboard_1m_v3
    dimensions: [resource___service___name, kind, status_code]
    measures:
      - { name: request_count, agg: count }
      - { name: duration_count, agg: count, column: duration }
      - { name: error_count, agg: count, filter: "status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 500" }
      - { name: duration_sum, agg: sum, column: duration }
      - { name: duration_min, agg: min, column: duration }
      - { name: duration_max, agg: max, column: duration }
      - { name: server_request_count, agg: count, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
      - { name: server_duration_count, agg: count, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
      - { name: server_duration_sum, agg: sum, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
      - { name: server_duration_min, agg: min, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
      - { name: server_duration_max, agg: max, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
      - { name: server_error_scope_count, agg: count, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
      - { name: server_error_count, agg: count, filter: "(kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http') AND (status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 500)" }
      - { name: server_duration_digest, agg: tdigest, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
      - { name: duration_digest, agg: tdigest, column: duration }
      # monoscope's *Active Services* stat, `dcount(resource.service.name)`. It is
      # the ONE dcount column that routes on a measure alone: the column is a
      # declared dimension, so the widget's `IS NOT NULL` becomes a row filter.
      # The other dcount panels guard on a NON-dimension (`name`, `body`,
      # `context___trace_id`) and would each also need a `count` guard measure —
      # *Unique Endpoints* additionally promotes a two-way `server` scope, which is
      # a filter variant the tier deliberately does not declare.
      - { name: service_name_hll, agg: hll, column: resource___service___name }
  # Coarse tier for wide windows. The matcher picks the coarsest grain that
  # divides the requested bucket width, so a 30-day chart (1d/6h buckets)
  # reads this and a 5-minute chart still reads the 1m tier. Derived from
  # that tier, so it re-aggregates its rows instead of scanning the raw
  # partition a second time — on this table that is the difference between
  # a few hundred thousand rows and hundreds of millions.
  - grain: 1h
    name: dashboard_1h_v2
    derive_from: dashboard_1m_v3
    dimensions: [resource___service___name, kind, status_code]
    measures:
         - { name: request_count, agg: count }
         - { name: duration_count, agg: count, column: duration }
         - { name: error_count, agg: count, filter: "status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 500" }
         - { name: duration_sum, agg: sum, column: duration }
         - { name: duration_min, agg: min, column: duration }
         - { name: duration_max, agg: max, column: duration }
         - { name: server_request_count, agg: count, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
         - { name: server_duration_count, agg: count, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
         - { name: server_duration_sum, agg: sum, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
         - { name: server_duration_min, agg: min, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
         - { name: server_duration_max, agg: max, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
         - { name: server_error_scope_count, agg: count, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
         - { name: server_error_count, agg: count, filter: "(kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http') AND (status_code = 'ERROR' OR COALESCE(attributes___http___response___status_code, 0) >= 500)" }
         - { name: server_duration_digest, agg: tdigest, column: duration, filter: "kind = 'server' OR name = 'apitoolkit-http-span' OR name = 'monoscope.http'" }
         - { name: duration_digest, agg: tdigest, column: duration }
         # A derived tier that does not declare a measure cannot serve it, so the
         # coarse grain would silently decline every wide dcount window.
         - { name: service_name_hll, agg: hll, column: resource___service___name }

  # NO `level` TIER. Tried and withdrawn on 2026-08-24, after pricing three costs
  # against zero measured benefit:
  #
  #   * it doubled enqueued rollup work (work scales with the declared spec count);
  #   * its derived half published 489 rollups of which 3 had rows, because a
  #     derived tier whose base is unbuilt is still claimable;
  #   * and — the one that decided it, SINCE FIXED — a young tier pinned the
  #     fleet. Both `rollup_min_contiguous_days` and `rollup_median_contiguous_days`
  #     folded every (source, tier) with `.min()`, so a tier at 2 days made the
  #     fleet gauge read 2 and `coverage_is_short()` (median vs
  #     `COVERAGE_SHORT_DAYS = 14`) held the whole cluster in coverage-short mode
  #     for an auxiliary tier nobody queries. `fold_fleet_gauge` in
  #     `database/maintain.rs` now has a tier younger than the horizon ABSTAIN,
  #     while the cross-tier `.min()` stays — it is what arms the backfill-ceiling
  #     override, so a genuinely starved `dashboard_1h_v2` must still trigger it.
  #
  # Read that third bullet as closed, NOT as re-authorisation: the first two are
  # untouched and remain grounds on their own. And ZERO of the misses observed in
  # production are `level`-shaped — they are endpoint-hash-scoped status-CLASS
  # charts, which `level` does not touch (docs/plans/2026-08-22-query-latency-matrix.md).
  #
  # Adding a spec is still safe by construction (`route_for` tries every declared
  # rollup and one that cannot serve declines). `status_class` — expressible as
  # declared count MEASURES with no new dimension — remains the one actually worth
  # having. Note a measure addition is not free either: it lands NULL in every
  # already-written cell, which is what `MissReason::MeasureNotStored` now refuses.
  #
  # The one case the fold fix does NOT cover, and it is untested: a long-lived tier
  # REBUILT from scratch under the same table name reads old, so it still pins.
