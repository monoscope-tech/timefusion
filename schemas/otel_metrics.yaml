table_name: otel_metrics
partitions:
  - project_id
  - date
# WIDENED to the sort prefix so `dedup_keys_lead_the_sort` holds and the rewrite
# takes the one-pass streaming collapse instead of the ROW_NUMBER window — the
# same change `otel_logs_and_spans` got on 2026-09-02 (`7beb411e`), which this
# table never received. The window form is 20-58x slower and cannot run at 8
# partitions at ANY pool size up to 1 GB
# (`docs/plans/2026-09-04-the-row-cap-guards-the-wrong-cost.md`).
#
# SAFE because the two keys are EQUIVALENT, measured over every live version on
# raw Delta files across all three heavy projects: 22,773,893 rows / 186 files,
# identical key cardinality every time and zero groups where this key merges two
# `id`s. Both columns are `nullable: false`, so there are no NULL-key cases.
# `sorting_columns` is UNCHANGED, so no existing file's footer is invalidated.
dedup_keys:
  - timestamp
  - metric_name
  - series_id
# TF-owned, for the same reason as otel_logs_and_spans: `stamp_version`
# overwrites this column, and `ingested_at` is client-visible data.
dedup_tiebreak: updated_at
tombstone_column: deleted
# RE-ENABLED 2026-08-02 (see read_dedup.rs). The earlier disable was because
# `version_append` forced a query-time SortExec: dedup is mandatory here, bounded
# dedup needs ordered input, and an UPDATE appends the row's ORIGINAL timestamp
# into a NEW file, so Delta files overlap in time and no ordering can be
# declared. That sort exhausted the 27.5GB query pool (1h ~13s, 3h timing out).
#
# Fixed at the source: DedupExec now runs keep-greatest WITHOUT a bound,
# buffering to end-of-stream instead of demanding an ordering. No SortExec, and
# unlike the old unbounded fallback (keep-first) it still serves the newest
# version. Watch `mor_delta_leg_sorts` — it must stay 0.
version_append: true
sorting_columns:
  - name: timestamp
    descending: true
    nulls_first: true
  - name: metric_name
    descending: false
    nulls_first: false
  - name: series_id
    descending: false
    nulls_first: false
z_order_columns: []
fields:
  - { name: project_id, data_type: Utf8, nullable: true }
  - { name: timestamp, data_type: 'Timestamp(Microsecond, Some("UTC"))', nullable: false }
  - { name: date, data_type: Date32, nullable: false }
  - { name: start_timestamp, data_type: 'Timestamp(Microsecond, Some("UTC"))', nullable: true }
  - { name: ingested_at, data_type: 'Timestamp(Microsecond, Some("UTC"))', nullable: false }
  - { name: id, data_type: Utf8, nullable: false, bloom_filter: true }
  - { name: series_id, data_type: Utf8, nullable: false, bloom_filter: true }
  - { name: metric_name, data_type: Utf8, nullable: false, bloom_filter: true }
  - { name: metric_description, data_type: Utf8, nullable: true }
  - { name: metric_unit, data_type: Utf8, nullable: false }
  - { name: metric_type, data_type: Utf8, nullable: false }
  - { name: aggregation_temporality, data_type: Utf8, nullable: true }
  - { name: is_monotonic, data_type: Boolean, nullable: true }
  - { name: flags, data_type: Int64, nullable: false }
  - { name: resource, data_type: Variant, nullable: true }
  - { name: resource_schema_url, data_type: Utf8, nullable: true }
  - { name: scope_name, data_type: Utf8, nullable: true }
  - { name: scope_version, data_type: Utf8, nullable: true }
  - { name: scope_schema_url, data_type: Utf8, nullable: true }
  - { name: attributes, data_type: Variant, nullable: true }
