  - { name: resource___container___name, data_type: Utf8, nullable: true }
  - { name: resource___k8s___cluster___name, data_type: Utf8, nullable: true }
  - { name: resource___k8s___namespace___name, data_type: Utf8, nullable: true }
  - { name: resource___k8s___pod___name, data_type: Utf8, nullable: true }
  - { name: resource___k8s___container___name, data_type: Utf8, nullable: true }
  - { name: resource___cloud___provider, data_type: Utf8, nullable: true }
  - { name: resource___cloud___region, data_type: Utf8, nullable: true }
  - { name: resource___cloud___availability___zone, data_type: Utf8, nullable: true }
