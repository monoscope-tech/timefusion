  - { name: value, data_type: Float64, nullable: true }
  - { name: value_double, data_type: Float64, nullable: true }
  - { name: value_int, data_type: Int64, nullable: true }
  - { name: distribution_count, data_type: Int64, nullable: true }
  - { name: distribution_sum, data_type: Float64, nullable: true }
  - { name: distribution_min, data_type: Float64, nullable: true }
  - { name: distribution_max, data_type: Float64, nullable: true }
  - { name: hist_bucket_counts, data_type: 'List(Int64)', nullable: true }
  - { name: hist_explicit_bounds, data_type: 'List(Float64)', nullable: true }
  - { name: exp_hist_scale, data_type: Int32, nullable: true }
  - { name: exp_hist_zero_count, data_type: Int64, nullable: true }
  - { name: exp_hist_zero_threshold, data_type: Float64, nullable: true }
  - { name: exp_hist_pos_offset, data_type: Int32, nullable: true }
  - { name: exp_hist_pos_buckets, data_type: 'List(Int64)', nullable: true }
  - { name: exp_hist_neg_offset, data_type: Int32, nullable: true }
  - { name: exp_hist_neg_buckets, data_type: 'List(Int64)', nullable: true }
  - { name: summary_quantiles, data_type: 'List(Float64)', nullable: true }
  - { name: summary_values, data_type: 'List(Float64)', nullable: true }
  - { name: message_size_bytes, data_type: Int64, nullable: false }
  # Merge-on-read pair, appended LAST to match the stored Delta schema (67 -> 69
  # via `migrate-columns`). See otel_logs_and_spans.yaml for why order matters.
  - { name: updated_at, data_type: 'Timestamp(Microsecond, Some("UTC"))', nullable: true }
  - { name: deleted, data_type: Boolean, nullable: true }

# Continuous-aggregate rollups. See otel_logs_and_spans.yaml for the mechanics.
#
# Dimensions are `metric_name` plus the emitting service, because that is what
# every metrics panel groups and filters by. `series_id` is deliberately absent:
# it is per-timeseries and would make the rollup a copy of the source. A panel
# whose series is an EXPRESSION (`COALESCE(resource___service___name,
# resource___container___name, 'unknown')`) still cannot route — the matcher only
# accepts a plain dimension column — but its `metric_name` filter can, so the
# scan it falls back to is already pruned.
#
# The grain is 1m because every metrics widget bins at `1 minute`; a coarser
# grain could not answer them at all.
rollups:
  - grain: 1m
    name: metrics_1m_v2
    dimensions: [metric_name, resource___service___name]
    measures:
      - { name: point_count, agg: count }
      # `value_count` pairs with `value_sum` to answer AVG(value): an average is
      # not decomposable, so the matcher rebuilds it from the two.
      - { name: value_count, agg: count, column: value }
      - { name: value_sum, agg: sum, column: value }
      - { name: value_min, agg: min, column: value }
      - { name: value_max, agg: max, column: value }
      # Percentiles over a metric are a routine ask ("p95 CPU"), and a t-digest
      # is the only percentile state that re-aggregates across buckets.
      - { name: value_digest, agg: tdigest, column: value }
  # Coarse tier for wide windows. 1m over 30 days is ~6.6M rows per project here;
  # at 1h it is ~110k, and the matcher picks the coarsest grain that divides the
  # requested bucket width, so a 30-day chart reads this and a 1-minute chart
  # still reads the tier above. Derived from that tier rather than from raw, so
  # it costs a scan of 220k rollup rows instead of a second pass over 1.8M
  # points — every measure here is associative, so the answer is identical.
  - grain: 1h
    name: metrics_1h_v2
    derive_from: metrics_1m_v2
    dimensions: [metric_name, resource___service___name]
    measures:
      - { name: point_count, agg: count }
      - { name: value_count, agg: count, column: value }
      - { name: value_sum, agg: sum, column: value }
      - { name: value_min, agg: min, column: value }
      - { name: value_max, agg: max, column: value }
      - { name: value_digest, agg: tdigest, column: value }
