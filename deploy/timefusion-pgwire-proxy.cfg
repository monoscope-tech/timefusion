global
  log stdout format raw local0
  maxconn 10000

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 1s
  timeout client 5m
  timeout server 5m
  timeout check 500ms

frontend pgwire
  bind :5432
  default_backend timefusion_pgwire

backend timefusion_pgwire
  option tcp-check
  default-server inter 250ms fastinter 100ms downinter 100ms rise 1 fall 2
  server timefusion srv-captain--timefusion:5432 check
