# The LIVE contents of the TimeFusion CapRover app's "Service Update Override".
#
# This file is documentation of a value that lives in CapRover, not something
# any pipeline applies. Keep it byte-equivalent to what is actually set, and
# re-read the live value before editing:
#
#   TOKEN=$(curl -s -X POST https://captain.s.past3.tech/api/v2/login \
#     -H 'Content-Type: application/json' -H 'x-namespace: captain' \
#     -d '{"password":"<admin>"}' | jq -r .data.token)
#   curl -s https://captain.s.past3.tech/api/v2/user/apps/appDefinitions \
#     -H "x-captain-auth: $TOKEN" -H 'x-namespace: captain' \
#     | jq -r '.data.appDefinitions[] | select(.appName=="timefusion") | .serviceUpdateOverride'
#
# Write it back by POSTing the whole app definition (with only this field
# changed) to /api/v2/user/apps/appDefinitions/update. The caprover CLI is the
# documented route but is broken under Node 25 — `caprover api` dies with
# `ERR_USE_AFTER_CLOSE: readline was closed` immediately after authenticating,
# with or without a TTY. The HTTP API above is what the CLI calls anyway.
#
# AS READ LIVE 2026-10-30 (CapRover appDefinitions + `docker service inspect`).
# The stored override now carries ONLY resources; the rest of the service spec
# below lives on the swarm service itself and survives deploys because CapRover
# merges the override into the existing spec. An earlier version of this file
# documented a fuller override that is not what CapRover holds. Re-read both
# before editing, and never paste a hand-written version.
#
# Stored override (byte-equivalent to the live value):
#
#   {"TaskTemplate": {"Resources": {"Limits": {"NanoCPUs": 44000000000, "MemoryBytes": 128849018880}, "Reservations": {"NanoCPUs": 12000000000, "MemoryBytes": 34359738368}}}}
#
# Live swarm spec outside the override:
#   UpdateConfig   {"Parallelism":1,"Delay":100000000,"FailureAction":"pause","Monitor":15000000000,"MaxFailureRatio":0.15,"Order":"stop-first"}
#   RollbackConfig {"Parallelism":1,"FailureAction":"pause","Monitor":15000000000,"MaxFailureRatio":0.15,"Order":"stop-first"}
#   ContainerSpec  StopGracePeriod 90s, Privileges.Seccomp unconfined
#
# - StopGracePeriod 90s: the drain + WAL handoff needs it; a shorter grace means
#   SIGKILL mid-drain.
# - Seccomp unconfined: required by the jemalloc/pprof profiling paths.
# - Limits.MemoryBytes 120 GiB: the cgroup limit is TimeFusion's ONLY memory
#   knob — the self-sizing budget tree derives every pool from `detected_limit_gb`
#   at startup. 120 GiB of the host's 188 GB leaves room for monoscope and the
#   collectors.
# - Reservations 32 GiB / 12 CPUs: scheduling floor.
# - Limits.NanoCPUs 44 CPUs (was 32 when this file was last written; 28 before
#   2026-09-12). The core count is not just a throughput knob: autotune derives
#   the maintenance budget tree and `TIMEFUSION_TANTIVY_BUILD_CONCURRENCY`
#   (cpus/8 = 5 at 44) from it, and ignores env overrides of derived knobs.
# - UpdateConfig.Order is stop-first, although deploy/README.md describes
#   forward deployments as start-first (HANDOFF + the 57P03 startup responder
#   make start-first safe). The two disagree; this records the live value only.
# - stop-first rollback: older binaries might not implement the liveness and
#   takeover contract, so rollback stays conservative.
#
# No EndpointSpec here on purpose: 5432 belongs to the stable
# srv-timefusion-pgwire-proxy service.
{
  "TaskTemplate": {
    "Resources": {
      "Limits": {
        "NanoCPUs": 44000000000,
        "MemoryBytes": 128849018880
      },
      "Reservations": {
        "NanoCPUs": 12000000000,
        "MemoryBytes": 34359738368
      }
    }
  }
}
