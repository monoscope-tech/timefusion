# The services CI starts, as a compose file you can run locally. Images and
# settings are kept identical to .github/workflows/ci.yml on purpose — a result
# is only worth caching if it was produced under the conditions CI would use.
#
# Only MinIO lives here. Unlike a containerised CI, ci.yml installs the toolchain
# pinned by rust-toolchain.toml and runs cargo on the runner directly, so
# `scripts/ci/ci.sh local` runs the checks with your own cargo and just supplies
# the service. That is the faithful reproduction, not a shortcut.
name: timefusion-ci

services:
  minio:
    # Pinned to the same known-good release as ci.yml so a breaking upstream tag
    # cannot silently change what "passing" means. `public.ecr.aws/bitnami/minio`
    # was withdrawn when Bitnami consolidated registries; the official image has
    # no default-bucket support, hence the `mc` service below.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Published on the host: the tests connect to 127.0.0.1:9000, exactly as
      # they do on the runner.
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot bucket seeding, replacing what MINIO_DEFAULT_BUCKETS used to do.
  # The mc image's ENTRYPOINT is mc itself, so it is overridden to run a script.
  mc:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/timefusion-test local/timefusion-tests"
    depends_on:
      minio: {condition: service_healthy}
